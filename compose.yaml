services:
  # 1. THE E-COMMERCE NODE.JS API SERVER
  api-server:
    build:
      context: .
    container_name: ecommerce_api_server
    command: npm run dev
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ecommerce-db
      DB_PORT: ${DB_PORT} 
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      ecommerce-db:
        condition: service_healthy

  # 2. THE E-COMMERCE POSTGRESQL DATABASE ENGINE
  ecommerce-db:
    image: postgres:18.4
    container_name: ecommerce_isolated_db
    restart: always
    entrypoint: >
      sh -c "chmod +x /docker-entrypoint-initdb.d/00_init_user.sh && exec /usr/local/bin/docker-entrypoint.sh postgres"
    environment:
      # Provisions the default cluster container name and administrative master password
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Use the admin root password from .env
      # We inject these as raw environment strings so our initialization script can read them
      APP_DB_USER: ${DB_USER}
      APP_DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - ecommerce_store_data:/var/lib/postgresql
    healthcheck:
      # Healthcheck now runs as the admin postgres user to ensure accurate cluster metrics
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. THE VISUAL STOREFRONT CLIENT UTILITY (Vite Frontend)
  store-frontend:
    build:
      context: ./frontend
    container_name: ecommerce_store_frontend
    ports:
      - "5173:5173"
    volumes:
      # Live File Sync Mirror: Maps your local frontend directory inside the container
      - ./frontend:/usr/src/app
      # FIXED FOR PERMISSIONS: Keeps node_modules completely isolated inside Linux storage
      - frontend_dependencies:/usr/src/app/node_modules
    depends_on:
      - api-server

volumes:
  ecommerce_store_data:
  # FIXED: Declares the dedicated isolated container package slot
  frontend_dependencies: