services:
  # 1. THE E-COMMERCE NODE.JS API SERVER
  api-server:
    build:
      context: .
    container_name: ecommerce_api_server
    command: npm run dev
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ecommerce-db
      DB_PORT: ${DB_PORT} 
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      ecommerce-db:
        condition: service_healthy

  # 2. THE E-COMMERCE POSTGRESQL DATABASE ENGINE
  ecommerce-db:
    image: postgres:18.4
    container_name: ecommerce_isolated_db
    restart: always
    entrypoint: >
      sh -c "chmod +x /docker-entrypoint-initdb.d/00_init_user.sh && exec /usr/local/bin/docker-entrypoint.sh postgres"
    environment:
      # Provisions the default cluster container name and administrative master password
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Use the admin root password from .env
      # We inject these as raw environment strings so our initialization script can read them
      APP_DB_USER: ${DB_USER}
      APP_DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - ecommerce_store_data:/var/lib/postgresql
    healthcheck:
      # Healthcheck now runs as the admin postgres user to ensure accurate cluster metrics
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. ENTERPRISE VISUAL DATABASE MANAGER (pgAdmin 4 v9.16)
 # 3. ENTERPRISE VISUAL DATABASE MANAGER (pgAdmin 4 v9.16)
  db-explorer:
    image: dpage/pgadmin4:9.16
    container_name: ecommerce_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@ecommerce.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-super_secure_pgadmin_password}
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    ports:
      - "5050:5050"
    volumes:
      # PERSISTENCE FIX: Stores your web panel sessions, logs, and layout adjustments safely on your disk
      - pgadmin_storage:/var/lib/pgadmin
      # AUTOMATION FIX: Maps your automated connection blueprint straight into pgAdmin's discovery path
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      ecommerce-db:
        condition: service_healthy

volumes:
  ecommerce_store_data:
  # Declares the persistent system storage slot for pgAdmin
  pgadmin_storage: